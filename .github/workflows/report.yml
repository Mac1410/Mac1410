name: morning-report

# Daily morning report on the paper book → Telegram, at 10:00 Italy time.
#
# GitHub's scheduled triggers are best-effort and are frequently delayed or
# skipped. So instead of a single fixed time, we attempt several times through
# the morning and use a once-per-day guard in the code (btc_bot.py
# --report-if-due): it sends only on the first run where it's >= 10:00 in
# Europe/Rome and a report hasn't already been sent today. This survives skipped
# triggers and handles CET/CEST automatically.

on:
  schedule:
    - cron: "0,30 7-9 * * *"   # 07:00–09:30 UTC every 30 min
    - cron: "0 10 * * *"       # 10:00 UTC backstop
  workflow_dispatch: {}        # manual run → always sends (forced)

permissions:
  contents: write              # persist last_report_date in advisor.db

concurrency:
  group: account-state         # shared with crypto-paper-bot → no concurrent state writes
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}   # optional free demo key → higher rate limits
      ADVISOR_DATA_SOURCE: coingecko
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-bot.txt
      - name: Send report (forced on manual run, else only if due)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python btc_bot.py --report
          else
            python btc_bot.py --report-if-due
          fi
      - name: Persist report state
        run: |
          git config user.name "crypto-paper-bot"
          git config user.email "bot@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --soft origin/main
            git add advisor.db
            if git diff --staged --quiet; then
              echo "No state change to commit."; exit 0
            fi
            git commit -q -m "report: state $(date -u +%FT%TZ) [skip ci]"
            if git push -q origin HEAD:main; then
              echo "state pushed"; exit 0
            fi
            echo "push race — retry $attempt"; sleep 3
          done
          echo "could not push state after retries (non-fatal)"; exit 0
