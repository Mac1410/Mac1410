name: crypto-paper-bot

# Runs the multi-crypto paper-trading bot on a schedule, in GitHub's cloud,
# so it keeps trading even when your PC is off and TradingView is closed.
#
# Setup (one-time):
#   1. Push this repo to YOUR OWN GitHub repository.
#   2. Repo → Settings → Secrets and variables → Actions → add secrets:
#        ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#   3. Repo → Actions tab → enable workflows.
#   4. (Optional) Actions → this workflow → "Run workflow" to test immediately.
#
# State (advisor.db) is committed back to the repo after each run so the
# virtual account persists between runs.

on:
  schedule:
    - cron: "0 */2 * * *"    # every 2 hours (UTC; GitHub may delay under load)
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write             # needed to commit advisor.db back

concurrency:
  group: crypto-paper-bot
  cancel-in-progress: false   # never cancel a run mid-trade

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ADVISOR_DATA_SOURCE: coingecko   # no TradingView in the cloud
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-bot.txt

      - name: Run one bot cycle
        run: python btc_bot.py --once   # no --telegram: only the daily report notifies

      - name: Persist virtual account state
        run: |
          git config user.name "crypto-paper-bot"
          git config user.email "bot@users.noreply.github.com"
          git add advisor.db
          if git diff --staged --quiet; then
            echo "No state change to commit."
          else
            git commit -m "bot: virtual account state $(date -u +%FT%TZ) [skip ci]"
            git push
          fi
