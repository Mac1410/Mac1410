name: crypto-paper-bot

# Runs the multi-crypto paper-trading bot on a schedule, in GitHub's cloud,
# so it keeps trading even when your PC is off and TradingView is closed.
#
# Setup (one-time):
#   1. Push this repo to YOUR OWN GitHub repository.
#   2. Repo → Settings → Secrets and variables → Actions → add secrets:
#        ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#   3. Repo → Actions tab → enable workflows.
#   4. (Optional) Actions → this workflow → "Run workflow" to test immediately.
#
# State (advisor.db) is committed back to the repo after each run so the
# virtual account persists between runs.

on:
  schedule:
    - cron: "0 * * * *"      # every hour (UTC; GitHub is best-effort and skips/delays some)
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write             # needed to commit advisor.db back

concurrency:
  group: account-state        # shared with morning-report → never write state concurrently
  cancel-in-progress: false   # never cancel a run mid-trade

jobs:
  run-bot:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}   # optional free demo key → higher rate limits
      ADVISOR_DATA_SOURCE: coingecko   # no TradingView in the cloud
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-bot.txt

      - name: Run one bot cycle
        run: python btc_bot.py --once   # no --telegram: only the daily report notifies

      - name: Send daily report if due (reliable catch-all — bot runs more often)
        run: python btc_bot.py --report-if-due

      - name: Persist virtual account state
        run: |
          git config user.name "crypto-paper-bot"
          git config user.email "bot@users.noreply.github.com"
          # Rebase-free, conflict-proof: put our advisor.db on top of latest origin.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --soft origin/main
            git add advisor.db
            if git diff --staged --quiet; then
              echo "No state change to commit."; exit 0
            fi
            git commit -q -m "bot: virtual account state $(date -u +%FT%TZ) [skip ci]"
            if git push -q origin HEAD:main; then
              echo "state pushed"; exit 0
            fi
            echo "push race — retry $attempt"; sleep 3
          done
          echo "could not push state after retries (non-fatal)"; exit 0
